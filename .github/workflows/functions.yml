name: Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 公開用の鍵（サービスアカウント）がまだ登録されていなければ、何もせずに終える
      - id: check
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::FIREBASE_SERVICE_ACCOUNT が未登録のため、Cloud Functions の公開を飛ばしました"; fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
        working-directory: functions
      - if: steps.check.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - if: steps.check.outputs.ready == 'true'
        run: npx --yes firebase-tools@15 deploy --only functions --project bucket-list-f1f95 --force --non-interactive
